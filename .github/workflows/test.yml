name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests
        run: node --test worker/index.test.mjs
      - name: Unit tests
        run: |
          python3 tests/run_tests.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate sites.json schema
        run: python3 scripts/validate_feeds.py --sites sites.json
