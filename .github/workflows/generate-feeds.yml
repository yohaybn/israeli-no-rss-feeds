name: Generate feeds

on:
  schedule:
    # Every 15 minutes. GitHub delays scheduled runs under load; expect 15-60 min in practice.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sites.json'
      - 'scripts/**'
      - '.github/workflows/generate-feeds.yml'

permissions:
  contents: write  # push generated feeds to the gh-pages branch

concurrency:
  group: generate-feeds
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install html2rss
        run: gem install html2rss --no-document

      - name: Fetch previous gh-pages output (keeps feeds of temporarily failing sites)
        run: |
          mkdir -p out
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out \
            2>/dev/null || echo "no gh-pages branch yet (first run)"

      - name: Generate feeds
        env:
          FEEDS_BASE_URL: https://yohay-ai.github.io/israeli-no-rss-feeds
        run: python3 scripts/generate_feeds.py

      - name: Validate generated feeds
        run: python3 scripts/validate_feeds.py --feeds-dir out/feeds

      - name: Publish to gh-pages
        run: |
          cd out
          if [ ! -d .git ]; then
            git init -q -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -q -m "feeds: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q origin gh-pages --force
